name: Update city list

# Builds assets/places/cities.tsv.gz from GeoNames (CC BY 4.0) and commits it
# to the branch it runs on. Run manually (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tool/build_city_list.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/places
          git commit -m "chore: update city list from GeoNames" || echo "nothing to commit"
          git push
