name: CI

# Runs on every push (branches and main). No separate pull_request trigger:
# the PR shows the checks of its head commit, and a second run would only
# double the Actions minutes. Pure documentation commits (e.g. STATUS.md)
# build nothing: a new "latest" APK would get a higher version code than a
# "preview" APK under test, and Android refuses to install the older one.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: every merge must build and publish its APK.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Skip if project not scaffolded yet
        id: guard
        run: |
          if [ -f pubspec.yaml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - run: flutter pub get
        if: steps.guard.outputs.ok == 'true'
      - name: Analyze
        if: steps.guard.outputs.ok == 'true'
        run: flutter analyze 2>&1 | tee analyze.log; exit ${PIPESTATUS[0]}
      - name: Format
        if: always() && steps.guard.outputs.ok == 'true'
        # On failure the log holds the exact patch (git diff) to apply
        run: |
          dart format lib test > /dev/null
          git diff --exit-code -- lib test > format.log
      - name: Test
        if: always() && steps.guard.outputs.ok == 'true'
        run: flutter test --reporter expanded 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      # Post failure output as a commit comment so it can be read via the API
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Passing-test progress lines and known warnings are dropped, so the
          # errors of failing tests fit into the comment.
<<<<<<< HEAD
          { echo '### CI failed'; echo '```'; tail -c 30000 analyze.log 2>/dev/null; echo; echo '--- format ---'; cat format.log 2>/dev/null; echo; echo '--- test ---'; grep -vE ': loading ' test.log 2>/dev/null | grep -vE '^[0-9]{2}:[0-9]{2} \+[0-9]+( ~[0-9]+)?( -[0-9]+)?: .*[^]]$' | grep -vE 'OpenStreetMap|osm-warn|tile servers|everyone|suitable|flutter_map|Codec failed|for your project|policies/tiles|^ *See:$' | tail -c 30000; echo '```'; } > report.md
=======
          { echo '### CI failed'; echo '```'; tail -c 30000 analyze.log 2>/dev/null; echo; echo '--- format ---'; cat format.log 2>/dev/null; echo; echo '--- test ---'; grep -vE ': loading ' test.log 2>/dev/null | grep -vE '^[0-9]{2}:[0-9]{2} \+[0-9]+( ~[0-9]+)?( -[0-9]+)?: .*[^]]$' | grep -vE 'OpenStreetMap|osm-warn|tile servers|everyone|suitable|flutter_map|Codec failed' | tail -c 30000; echo '```'; } > report.md
>>>>>>> origin/main
          jq -Rs '{body: .}' report.md > body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d @body.json > /dev/null

  # Build the APK only on main; on branches only with “[apk]” in the commit message
  # (saves ~6 min per TDD cycle).
  build-apk:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/epic/') || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Stable release key from the repository secrets, so every APK can update
      # the installed app (see CLAUDE.md, "Release signing").
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set – the APK is signed with a temporary debug key and cannot update an installed app."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      # Post the build output as a commit comment so it can be read via the API
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### APK build failed'; echo '```'; grep -vE '^\s*$' build.log 2>/dev/null | tail -c 30000; echo '```'; } > report.md
          jq -Rs '{body: .}' report.md > body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d @body.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: trailtale-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # On main: publish the APK as release “latest” (direct download on the phone)
      - name: Release latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk trailtale.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest trailtale.apk --target "$GITHUB_SHA" \
            --title "Trailtale (latest)" \
            --notes "Built automatically from ${GITHUB_SHA::7}. To install, download trailtale.apk on your phone and open it."
      # On an epic branch: publish the APK as pre-release “preview” for testing
      # on the phone before the epic is merged (same key, so it updates in place).
      - name: Release preview
        if: startsWith(github.ref, 'refs/heads/epic/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk trailtale-preview.apk
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview trailtale-preview.apk --target "$GITHUB_SHA" --prerelease \
            --title "Trailtale preview (${GITHUB_REF_NAME})" \
            --notes "Test build from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7} – not yet on main. To install, download trailtale-preview.apk on your phone and open it."
